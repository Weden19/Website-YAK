name: Проверка ссылок

on:
  push:
  pull_request:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Проверить внутренние ссылки и файлы
        run: node .github/scripts/check-links.js
